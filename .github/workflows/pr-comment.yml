name: PR Validation Comment
on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
jobs:
  comment:
    name: Post validation comment
    runs-on: ubuntu-slim
    # workflow_run always runs against the base branch, so GITHUB_TOKEN is privileged here even for fork PRs.
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      pull-requests: write
    steps:
      - name: Download validation results
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pr-validation-results
          path: results

      - name: Post consolidated comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const read = (file) => {
              try { return fs.readFileSync(path.join('results', file), 'utf8').trim(); }
              catch { return null; }
            };

            // Fence-strip + truncate: contents come from a PR's own (attacker-controlled) run.
            const sanitize = (text, max = 3000) => {
              let out = text.replace(/```/g, "'''");
              if (out.length > max) out = out.slice(0, max) + '\n... (truncated)';
              return out;
            };

            // The artifact was built by the PR's own job, so its pr_number.txt is attacker-controlled.
            // Look up the real PR from the trusted workflow_run head SHA instead of trusting the file.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            const prNumber = prs.length > 0 ? prs[0].number : null;
            if (!prNumber || !Number.isInteger(prNumber)) return;

            const sections = [];

            if (read('check_targeting_outcome.txt') === 'failure') {
              sections.push('### ❌ Invalid target branch\n\nPR must target the `testing` branch.');
            }

            if (read('check_files_outcome.txt') === 'failure') {
              const files = sanitize(read('invalid_files.txt') || '');
              sections.push(
                '### ❌ Files outside `widgets/`\n\n' +
                'Only files under `widgets/` may be changed in a PR.\n\n' +
                '```\n' + files + '\n```'
              );
            }

            if (read('validate_outcome.txt') === 'failure') {
              const output = sanitize(read('validation.txt') || '');
              sections.push('### ❌ Widget validation failed\n\n```\n' + output + '\n```');
            }

            if (sections.length === 0) return;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body:
                '## ❌ PR validation failed\n\n' +
                'Please fix the following before merging:\n\n' +
                sections.join('\n\n---\n\n'),
            });

name: PR Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-validation:
    name: Check targeting -> Check Widgets/ Changed -> Validate
    runs-on: ubuntu-slim
    if: "!(github.base_ref == 'main' && github.head_ref == 'testing')"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check targeting
        id: check_targeting
        continue-on-error: true
        run: |
          if [ "${{ github.base_ref }}" != "testing" ]; then
            echo "PR must target the \`testing\` branch." > targeting_error.txt
            exit 1
          fi

      - name: Check Widgets/ Changed
        id: check_files
        continue-on-error: true
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "Changed files:"
          echo "$changed"
          invalid=$(echo "$changed" | grep -v '^widgets/' | grep -v '^\s*$' || true)
          if [ -n "$invalid" ]; then
            echo "$invalid" > invalid_files.txt
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate
        id: validate
        continue-on-error: true
        run: |
          npm ci
          node scripts/validate-widgets.js > validation.txt 2>&1 || exit 1

      # PR-triggered runs (incl. forks) get a read-only token, so this job can't comment itself.
      # It hands outcomes to pr-comment.yml via artifact, which runs privileged and looks up the PR itself.
      - name: Record outcomes
        if: always()
        run: |
          echo "${{ steps.check_targeting.outcome }}" > check_targeting_outcome.txt
          echo "${{ steps.check_files.outcome }}" > check_files_outcome.txt
          echo "${{ steps.validate.outcome }}" > validate_outcome.txt

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-results
          path: |
            check_targeting_outcome.txt
            check_files_outcome.txt
            validate_outcome.txt
            targeting_error.txt
            invalid_files.txt
            validation.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail if any checks failed
        if: >
          steps.check_targeting.outcome == 'failure' ||
          steps.check_files.outcome == 'failure' ||
          steps.validate.outcome == 'failure'
        run: exit 1
